<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Secure USB</title>
</head>
<body>
    <h1>Secure USB Storage</h1>
    <h2>Вход в устройство</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        <p>Логин</p>
        <input type="text" name="username">

        <p>Пароль</p>
        <input type="password" name="password">

        <br><br>
        <button type="submit">Войти</button>
    </form>
</body>
</html>
